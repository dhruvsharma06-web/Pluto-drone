name: inspection_ui
description: Flutter presentation workspace owned by frontend developer.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
  inspection_contract:
    path: ../inspection_contract
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/PlayfairDisplay-OFL.txt
  fonts:
    - family: InspectionSans
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
    - family: InspectionDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          weight: 500
          style: italic
