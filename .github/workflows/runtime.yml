name: Flutter runtime checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Runtime analysis and tests (synthetic evidence only)
        working-directory: packages/inspection_runtime
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Integrated Flutter UI checks
        working-directory: packages/inspection_ui
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Mobile analysis and tests
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
